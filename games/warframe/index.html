<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://nftw-auth.nightmareftw.workers.dev https://api.github.com https://github.com https://api.warframestat.us https://cloudflareinsights.com; frame-src https://outlast.fex.dev; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warframe · NightmareFTW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/style.css?v=fbd14ea4">
  <link rel="stylesheet" href="../../assets/css/games/warframe.css?v=171502df">
</head>
<body data-game="warframe">
  <div class="bg-grid" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../../index.html"><span class="brand-mark">▲</span><span class="brand-name">Nightmare<span class="accent">FTW</span></span></a>
      <nav class="top-nav"><a href="../../index.html">Hub</a></nav>
    </div>
  </header>
  <main class="container wf-main">
    <p class="breadcrumb"><a href="../../index.html">hub</a> / <span id="bc-game">Warframe</span></p>

    <section class="wf-panel wf-hero" id="wf-hero">
      <div class="wf-corner tl"></div>
      <div class="wf-corner br" style="--wfc: var(--wf-amber);"></div>
      <div class="wf-hero-glyph" aria-hidden="true"></div>
      <div class="wf-hero-glyph inner" aria-hidden="true"></div>
      <div class="wf-hero-inner">
        <p class="wf-tag wf-eyebrow"><span class="wf-dot"></span> <span id="wf-blurb">Sci-fi co-op looter shooter.</span></p>
        <h1>WARFRAME</h1>
        <p>Live worldstate data, open-world cycle timers and the full relic &amp; mission drop table — pulled straight from the game's own API.</p>
        <div class="wf-reset" id="wf-reset"></div>
      </div>
    </section>

    <div class="wf-tabs" id="wf-tabs" role="tablist">
      <button class="wf-tab active" data-tab="tools" role="tab" aria-selected="true">Tools</button>
      <button class="wf-tab" data-tab="news" role="tab" aria-selected="false">News</button>
      <button class="wf-tab" data-tab="codes" role="tab" aria-selected="false">Codes</button>
    </div>

    <section class="wf-panel-body" data-panel="tools" data-active="1">
      <div class="wf-controls">
        <input type="search" id="wf-tool-search" class="wf-input" placeholder="Search tools…" autocomplete="off">
        <select id="wf-tool-sort" class="wf-select">
          <option value="default">Sort: Default</option>
          <option value="az">Name A–Z</option>
          <option value="za">Name Z–A</option>
        </select>
        <div class="wf-view-toggle" id="wf-tool-view">
          <button data-view="grid" class="active" title="Grid" aria-label="Grid view">▦</button>
          <button data-view="list" title="List" aria-label="List view">≣</button>
        </div>
      </div>
      <div class="wf-tool-grid" id="wf-tool-grid"></div>
      <p id="wf-tool-empty" class="wf-empty" style="display:none">No tools match.</p>
    </section>

    <section class="wf-panel-body" data-panel="news">
      <div id="wf-news-root"><p class="wf-empty">Loading news…</p></div>
    </section>

    <section class="wf-panel-body" data-panel="codes">
      <div id="wf-codes-root"><p class="wf-empty">Loading codes…</p></div>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><span>Built by NightmareFTW.</span></div></footer>
  <script src="../../assets/js/data.js?v=b084289f"></script>
  <script src="index.js?v=ee304c53"></script>
  <script src="/assets/js/i18n.js?v=afda3371" defer></script>

</body>
</html>
