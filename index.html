<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://nftw-auth.nightmareftw.workers.dev https://api.github.com https://github.com https://api.warframestat.us https://cloudflareinsights.com; frame-src https://outlast.fex.dev; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NightmareFTW · Gaming Tools Hub</title>
  <meta name="description" content="A growing collection of tools for the games I play.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css?v=02e50fb5">
  <link rel="stylesheet" href="assets/css/home.css?v=5fc4ce5e">
</head>
<body>
  <div class="app">
    <!-- ========== RAIL: the game index ========== -->
    <aside class="rail">
      <a class="c-brand" href="index.html">
        <svg width="20" height="18" viewBox="0 0 20 18" aria-hidden="true"><path d="M10 0 0 18h10z" fill="#ff2a38"/><path d="M10 0v18h10z" fill="#c01320"/></svg>
        <b>Nightmare<i>FTW</i></b>
        <span class="tag">Console</span>
      </a>
      <div class="rail-search">
        <label class="field">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" type="search" placeholder="Search games and tools" autocomplete="off" aria-label="Search games and tools">
          <kbd>/</kbd>
        </label>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Filter library">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="live" class="lv" aria-pressed="false">Live</button>
        <button data-f="builder" aria-pressed="false">Builders</button>
        <button data-f="database" aria-pressed="false">Databases</button>
        <button data-f="checklist" aria-pressed="false">Checklists</button>
        <button data-f="guide" aria-pressed="false">Guides</button>
      </div>
      <div class="rail-scroll">
        <div class="pinned" id="pinned" hidden>
          <div class="rail-head"><span>Pinned</span></div>
          <div id="pinned-list"></div>
        </div>
        <div class="rail-head"><span>Library</span><span id="lib-count" class="num"></span></div>
        <div class="rail-list" id="rail-list"></div>
        <div id="rail-empty" hidden style="padding:24px 14px;font:500 12px/1.5 var(--mono);color:var(--text-4)">No match.</div>
      </div>
      <div class="rail-foot">
        <a href="https://github.com/NightmareFTW" target="_blank" rel="noopener">GitHub ↗</a>
        <span style="margin-left:auto">Gaming tools hub</span>
      </div>
    </aside>

    <!-- ========== STAGE ========== -->
    <main class="stage">
      <div class="topbar">
        <nav class="nav" aria-label="Sections">
          <a href="index.html" class="on" aria-current="page">Hub</a>
          <a href="play/index.html">Play</a>
        </nav>
        <div class="crumb" id="crumb"><span class="sm">Hub / </span><b>—</b></div>
        <div class="top-nav"><!-- EN/PT flags, Steam bell, GitHub + sign-in injected by i18n.js / steam-alerts.js / auth.js --></div>
      </div>
      <div class="spectrum" id="spectrum" role="group" aria-label="Jump to game"></div>
      <div class="scroll" id="scroll">
        <h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">NightmareFTW — gaming tools hub</h1>
        <section class="hero" id="hero" aria-live="polite"></section>
        <section class="block">
          <div class="block-head"><h2>Tools</h2><span class="ln"></span><span class="ct num" id="tool-count"></span></div>
          <div class="tools" id="tools"></div>
        </section>
        <section class="block" style="padding-top:4px">
          <div class="block-head"><h2>What's New</h2><span class="ln"></span><span class="ct num" id="feed-count"></span></div>
          <div class="feed" id="feed"></div>
        </section>
        <footer class="ftr">
          <span><b>NightmareFTW</b> — Built by NightmareFTW.</span>
          <span>vanilla HTML, CSS &amp; JS</span>
          <a href="https://github.com/NightmareFTW" target="_blank" rel="noopener" style="margin-left:auto">GitHub ↗</a>
        </footer>
      </div>
    </main>
  </div>

  <script src="assets/js/data.js?v=9af3447b"></script>
  <script src="assets/js/home.js?v=3670534d"></script>
  <script src="/assets/js/i18n.js?v=bb6066e4" defer></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b0fc25d6ec3948f58b0a240fab9e9500"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
