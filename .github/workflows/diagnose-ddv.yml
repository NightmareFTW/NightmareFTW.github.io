name: Diagnose Dreamlight Valley wiki scraping

# Temporary manual-only workflow to inspect why the DDV scrapers are parsing
# zero items from dreamlightvalleywiki.com. Prints structural markers to the
# job log; does not write or commit any data. Safe to delete once the
# scrapers are fixed.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Fetch pages and print structure
        run: node scripts/ddv-diagnose.js
