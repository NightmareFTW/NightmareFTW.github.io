name: TEMP capture screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Playwright
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          npx http-server -p 8080 -s . &
          sleep 2
      - name: Capture screenshots
        run: node scripts/capture-screenshots.js
        env:
          BASE_URL: http://127.0.0.1:8080
      - name: Commit changes if any
        uses: ./.github/actions/commit-data
        with:
          paths: "assets/screenshots"
          message: "chore: recapture README screenshots with verified image loads"
