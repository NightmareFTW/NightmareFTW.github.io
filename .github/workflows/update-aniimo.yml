name: Update Aniimo database

on:
  schedule:
    - cron: "20 5 * * *"   # daily, 05:20 UTC (the game and its wiki are brand new, still filling in)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aniimo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Scrape Aniimo creatures & regions (wiki.aniimo.com)
        run: node scripts/update-aniimo.js
      - name: Commit changes if any
        uses: ./.github/actions/commit-data
        with:
          paths: "data/aniimo"
          message: "chore: auto-update Aniimo database"
